name: thumb-features
# .github/thumb-targets.txt（チャンネル<TAB>動画ID）のサムネを取り、文字の位置・大きさ・色、絵の種類などの数字だけを
# analysis/raw/thumb_features/ に保存する。サムネ画像そのものは載せない。
on:
  push:
    branches: ['claude/**']
    paths: ['.github/thumb-targets.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  feat:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: { shard: [0, 1, 2, 3, 4, 5, 6, 7] }
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -q easyocr open_clip_torch pillow numpy && pip uninstall -y -q opencv-python opencv-python-headless opencv-contrib-python || true; pip install -q opencv-python-headless && python -c 'import cv2;print(cv2.__version__, hasattr(cv2,"CascadeClassifier"))'
      - run: python .github/scripts/thumb_features.py .github/thumb-targets.txt ${{ matrix.shard }} 8 feat_${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with: { name: 'feat_${{ matrix.shard }}', path: 'feat_${{ matrix.shard }}.json' }
  merge:
    needs: feat
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: parts, pattern: 'feat_*', merge-multiple: true }
      - run: |
          mkdir -p analysis/raw/thumb_features
          python3 - <<'PY'
          import json,glob,os
          allr={}
          for f in glob.glob('parts/*.json'): allr.update(json.load(open(f)))
          by={}
          for vid,r in allr.items(): by.setdefault(r.get('ch','x'),{})[vid]=r
          for ch,d in by.items(): json.dump(d,open(f'analysis/raw/thumb_features/{ch}.json','w'),ensure_ascii=False,indent=0)
          print(len(allr))
          PY
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add analysis/raw/thumb_features && git commit -m "thumb features" && git pull --rebase origin ${GITHUB_REF_NAME} && git push || echo nothing
