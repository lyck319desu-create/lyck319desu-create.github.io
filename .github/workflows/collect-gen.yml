name: collect-gen
# gen-images の途中でも、終わった分の絵（成果物）を analysis/gen/ に置く。.github/collect-run.txt に実行 ID を書いて push する。
on:
  push:
    branches: ['claude/**']
    paths: ['.github/collect-run.txt']
permissions:
  contents: write
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "RUN=$(head -1 .github/collect-run.txt | cut -d' ' -f1)" >> $GITHUB_ENV
      - uses: actions/download-artifact@v4
        with: { path: dl, pattern: '*-*', merge-multiple: true, run-id: '${{ env.RUN }}', github-token: '${{ github.token }}' }
      - run: |
          mkdir -p analysis/gen && cp dl/*.png analysis/gen/ 2>/dev/null || true
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add analysis/gen && git commit -m "Collect generated sample images" && git push || echo nothing
