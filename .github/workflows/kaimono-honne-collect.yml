# 買い物ホンネ帳（kaimono-honne/ フォルダ）用。
# 毎日1回、コンビニ各社の新商品ページを読んで kaimono-honne/data/products.json を更新します。
# 手動で動かすとき: GitHub の「Actions」タブ →「買い物ホンネ帳: 新商品を集める」→「Run workflow」
name: "買い物ホンネ帳: 新商品を集める"

on:
  schedule:
    - cron: "17 21 * * *" # 毎日 06:17（日本時間）。UTC で書くので 21:17 になっています
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kaimono-honne-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 新商品を集める
        run: node kaimono-honne/scripts/collect.mjs

      - name: 変わっていたら保存する
        run: |
          FILE=kaimono-honne/data/products.json
          if git diff --quiet -- "$FILE"; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "買い物ホンネ帳: 新商品を更新 ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
          # ほかの自動更新と同時になったときのため、最新を取り込んでから送る（3回まで）
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 10))
          done
          echo "::error::保存に失敗しました"
          exit 1
