name: fetch-channel
# ベンチマーク用：.github/fetch-targets.txt のハンドルごとに公開動画一覧（タイトル・再生数・長さ）と RSS を analysis/raw/ に保存。
# サムネは公開リポジトリに載せず、Actions の成果物（thumbs）として残す。
on:
  push:
    branches: ['claude/**']
    paths: ['.github/fetch-targets.txt', '.github/fetch-details.txt', '.github/fetch-search.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q yt-dlp
      - name: fetch
        run: |
          set -x
          while read -r handle; do
            case "$handle" in ""|"#"*) continue;; esac
            out="analysis/raw/$handle"; mkdir -p "$out/thumbs"
            case "$handle" in UC*) base="https://www.youtube.com/channel/$handle";; *) base="https://www.youtube.com/@$handle";; esac
            for tab in videos shorts streams; do
              yt-dlp --flat-playlist -J "$base/$tab" > "$out/$tab.json" 2> "$out/$tab.err" || true
            done
            cid=$(curl -sL "$base" | grep -o '"externalId":"UC[^"]*"' | head -1 | cut -d'"' -f4 || true)
            echo "cid=$cid"
            if [ -n "$cid" ]; then
              curl -sL "https://www.youtube.com/feeds/videos.xml?channel_id=$cid" > "$out/feed.xml" || true
              yt-dlp --flat-playlist -J "https://www.youtube.com/playlist?list=UU${cid#UC}" > "$out/uploads.json" 2> "$out/uploads.err" || true
            fi
            python3 - "$out" <<'PY'
          import json,sys,os,urllib.request
          out=sys.argv[1]; rows=[]
          for tab in ['videos','shorts','streams','uploads']:
              p=f'{out}/{tab}.json'
              try: d=json.load(open(p)) or {}
              except Exception: continue
              for e in d.get('entries') or []:
                  if not e: continue
                  rows.append({'tab':tab,'id':e.get('id'),'title':e.get('title'),'views':e.get('view_count'),'duration':e.get('duration')})
          json.dump(rows,open(f'{out}/list.json','w'),ensure_ascii=False,indent=1)
          vids=sorted([r for r in rows if r['tab'] in ('videos','uploads')],key=lambda r:-(r['views'] or 0))
          for r in vids[:40]:
              for q in ['maxresdefault','hqdefault']:
                  try:
                      urllib.request.urlretrieve(f"https://i.ytimg.com/vi/{r['id']}/{q}.jpg",f"{out}/thumbs/{r['id']}.jpg"); break
                  except Exception: pass
          PY
            mkdir -p thumbs/$handle && mv "$out"/thumbs/* thumbs/$handle/ 2>/dev/null; rm -rf "$out"/thumbs "$out"/*.err
          done < .github/fetch-targets.txt
      - name: details
        # .github/fetch-details.txt の動画IDごとに概要欄・チャプター・高評価・自動字幕を保存
        run: |
          [ -f .github/fetch-details.txt ] || exit 0
          while read -r handle vid; do
            case "$handle" in ""|"#"*) continue;; esac
            out="analysis/raw/$handle/details"; mkdir -p "$out"
            yt-dlp --skip-download -J "https://www.youtube.com/watch?v=$vid" > "$out/$vid.full.json" 2> "$out/$vid.err" < /dev/null || true
            python3 - "$out/$vid.full.json" "$out/$vid.json" <<'PY'
          import json,sys
          try: d=json.load(open(sys.argv[1])) or {}
          except Exception: sys.exit(0)
          if not d: sys.exit(0)
          keep={k:d.get(k) for k in ['id','title','description','chapters','duration','view_count','like_count','comment_count','upload_date','tags','categories']}
          json.dump(keep,open(sys.argv[2],'w'),ensure_ascii=False,indent=1)
          PY
            rm -f "$out/$vid.full.json"
            yt-dlp --skip-download --write-auto-subs --write-subs --sub-langs 'ja.*,ja' --sub-format vtt -o "$out/%(id)s.%(ext)s" "https://www.youtube.com/watch?v=$vid" 2>> "$out/$vid.err" < /dev/null || true
          done < .github/fetch-details.txt
      - name: search
        # .github/fetch-search.txt の「名前<TAB>検索語」ごとに YouTube 検索の上位（タイトル・再生数・長さ・チャンネル）を保存
        run: |
          [ -f .github/fetch-search.txt ] || exit 0
          mkdir -p analysis/raw/search
          while IFS=$'\t' read -r name query; do
            case "$name" in ""|"#"*) continue;; esac
            case "$query" in http*) src="$query";; *) src="ytsearch60:$query";; esac
            yt-dlp --flat-playlist --playlist-end 80 -J "$src" > "analysis/raw/search/$name.full.json" 2> /dev/null < /dev/null || true
            python3 - "analysis/raw/search/$name.full.json" "analysis/raw/search/$name.json" "$query" <<'PY'
          import json,sys
          try: d=json.load(open(sys.argv[1])) or {}
          except Exception: d={}
          rows=[{k:e.get(k) for k in ['id','title','view_count','duration','channel','channel_id','uploader_id']} for e in d.get('entries') or [] if e]
          json.dump({'query':sys.argv[3],'entries':rows},open(sys.argv[2],'w'),ensure_ascii=False,indent=1)
          PY
            rm -f "analysis/raw/search/$name.full.json"
          done < .github/fetch-search.txt
          # 検索に出たチャンネルごとに RSS を取り、開設日・直近15本の公開日と再生数を channels.json にまとめる
          python3 - <<'PY'
          import json,glob,re,urllib.request,html
          out='analysis/raw/search/channels.json'
          try: known=json.load(open(out))
          except Exception: known={}
          ids=set()
          for f in glob.glob('analysis/raw/search/*.json'):
              if f.endswith('channels.json'): continue
              for e in (json.load(open(f)).get('entries') or []):
                  if e.get('channel_id'): ids.add(e['channel_id'])
          for cid in sorted(ids-set(known)):
              try: x=urllib.request.urlopen(f'https://www.youtube.com/feeds/videos.xml?channel_id={cid}',timeout=20).read().decode()
              except Exception: continue
              head=x.split('<entry>')[0]
              m=re.search(r'<published>([^<]+)',head); t=re.search(r'<title>([^<]+)',head)
              vids=[]
              for ent in x.split('<entry>')[1:]:
                  g=lambda r:(re.search(r,ent) or [None,None])[1]
                  vids.append({'id':g(r'<yt:videoId>([^<]+)'),'title':html.unescape(g(r'<title>([^<]+)') or ''),'published':g(r'<published>([^<]+)'),'views':int(g(r'views="(\d+)"') or 0)})
              known[cid]={'name':html.unescape(t[1]) if t else None,'created':m[1] if m else None,'recent':vids}
          json.dump(known,open(out,'w'),ensure_ascii=False,indent=1)
          PY
      - name: thumb-notes
        # サムネは載せずに、文字（OCR）と主な色と明るさの配置だけを analysis/raw/<handle>/thumbs_notes.json に残す
        run: |
          [ -d thumbs ] || exit 0
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-jpn >/dev/null 2>&1 || true
          pip install -q pillow
          for d in thumbs/*/; do
            h=$(basename "$d"); python3 - "$d" "analysis/raw/$h/thumbs_notes.json" <<'PY'
          import sys,os,json,subprocess
          from PIL import Image
          d,out=sys.argv[1],sys.argv[2]; res={}
          for f in sorted(os.listdir(d)):
              if not f.endswith('.jpg'): continue
              im=Image.open(os.path.join(d,f)).convert('RGB'); w,h=im.size
              def ocr(psm):
                  try: return subprocess.run(['tesseract',os.path.join(d,f),'-','-l','jpn+eng','--psm',psm],capture_output=True,text=True).stdout.strip()
                  except Exception: return ''
              pal=im.resize((160,90)).quantize(6).convert('RGB').getcolors(99999) or []
              pal=sorted(pal,reverse=True)[:6]; tot=sum(c for c,_ in pal) or 1
              g=im.resize((4,3)).convert('L')
              res[f[:-4]]={'size':[w,h],'ocr':ocr('11'),'ocr_block':ocr('3'),
                'colors':[{'hex':'#%02x%02x%02x'%c,'share':round(n/tot,2)} for n,c in pal],
                'brightness_4x3':[[g.getpixel((x,y)) for x in range(4)] for y in range(3)]}
          json.dump(res,open(out,'w'),ensure_ascii=False,indent=1)
          PY
          done
      - uses: actions/upload-artifact@v4
        with: { name: thumbs, path: thumbs, if-no-files-found: ignore }
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add analysis/raw && git commit -m "Fetch benchmark channel data" && git push || echo nothing
